# Build and deploy only the web app (faster than the full build). Run from the repo root:
#   gcloud builds submit --config infra/gcp/cloudbuild-web.yaml --substitutions=SHORT_SHA=$(git rev-parse --short HEAD)
substitutions:
  _REGION: us-west1
  _REPO: terraform-robotics
  _CLERK_PUBLISHABLE_KEY: pk_test_YXJyaXZpbmctYmFzaWxpc2stNzE2OC5jbGVyay5hY2NvdW50cy5kZXYk
images:
  - ${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}
steps:
  - id: build-web
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "apps/web/Dockerfile", "--build-arg", "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${_CLERK_PUBLISHABLE_KEY}",
           "-t", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}", "."]
  - id: push
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}"]
  - id: deploy-web
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args: ["run", "deploy", "web", "--region=${_REGION}", "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/web:${SHORT_SHA}"]
