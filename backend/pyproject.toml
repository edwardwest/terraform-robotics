[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "terraform-robotics-backend"
version = "0.1.0"
description = "Terraform Robotics API, terrain worker and geoprocessing library"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "shapely>=2.0",
  "rasterio>=1.4",
  "pyproj>=3.6",
  "scikit-image>=0.24",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "python-multipart>=0.0.9",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9",
  "rio-tiler>=7.0",
  "ezdxf>=1.3",
  "pyshp>=2.3",
  "openpyxl>=3.1",
  "reportlab>=4.2",
]

[project.optional-dependencies]
# Fetching USGS 3DEP and talking to Google Cloud are optional so tr_geo stays light.
public-data = ["py3dep>=0.17"]
gcp = ["google-cloud-storage>=2.18", "google-cloud-run>=0.10"]
dev = ["pytest>=8"]

[project.scripts]
tr-worker = "tr_worker.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
